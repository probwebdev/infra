services:

  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    restart: always
    deploy:
      resources:
        limits:
          memory: 1024mb
    labels:
      - "com.getarcaneapp.arcane.updater=true"
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls=true"
      - "traefik.http.routers.pihole.rule=Host(`dns.home.arpa`)"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      - "TZ=Europe/Stockholm"
      - "FTLCONF_dns_listeningMode=ALL"
    cap_add:
      - SYS_NICE
    networks:
      - services
    volumes:
      - pihole-config:/etc/pihole

networks:
  services:
    external: true

volumes:
  pihole-config:
    external: true
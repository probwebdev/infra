services:

  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    restart: unless-stopped
    cgroup: host
    deploy:
      resources:
        limits:
          memory: 512mb
    environment:
      ENCRYPTION_KEY: ${ARCANE_ENCRYPTION_KEY}
      JWT_SECRET: ${ARCANE_JWT_SECRET}
      APP_URL: https://arcane.home.arpa
      TRUSTED_PROXIES: 172.18.0.0/16
      TZ: Europe/Stockholm
      PUID: 1000
      PGID: 1000
    healthcheck:
      test: ["CMD", "./arcane", "health", "--timeout", "2s"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=services"
      - "traefik.http.routers.arcane-grpc.rule=Host(`arcane.home.arpa`) && Path(`/api/tunnel/connect`) && Method(`POST`) && HeaderRegexp(`Content-Type`, `^application/grpc`)"
      - "traefik.http.routers.arcane-grpc.entrypoints=websecure"
      - "traefik.http.routers.arcane-grpc.priority=100"
      - "traefik.http.routers.arcane-grpc.tls=true"
      - "traefik.http.routers.arcane-grpc.service=arcane-grpc"
      - "traefik.http.services.arcane-grpc.loadbalancer.server.port=3552"
      - "traefik.http.services.arcane-grpc.loadbalancer.server.scheme=h2c"
      - "traefik.http.routers.arcane-web.rule=Host(`arcane.home.arpa`)"
      - "traefik.http.routers.arcane-web.entrypoints=websecure"
      - "traefik.http.routers.arcane-web.priority=10"
      - "traefik.http.routers.arcane-web.tls=true"
      - "traefik.http.routers.arcane-web.service=arcane-web"
      - "traefik.http.services.arcane-web.loadbalancer.server.port=3552"
      - "traefik.http.services.arcane-web.loadbalancer.server.scheme=http"
    networks:
      - services
      - agent_network
    ports:
      - "3552:3552"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data

networks:
  agent_network:
    attachable: true
  services:
    external: true

volumes:
  arcane-data:
    external: true
